<svg viewBox="0 -40 880 292" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <style>
    .title { font-size: 11px; font-weight: 700; fill: #273036; }
    .chip { font-size: 10px; font-weight: 600; fill: #273036; }
    .sub { font-size: 9.5px; fill: #9ca3af; }
    .rail { font-size: 9.5px; font-weight: 700; letter-spacing: .07em; fill: #8a8f98; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .flow { stroke: #8e8e93; stroke-width: 1.8; fill: none; marker-end: url(#arrM); }
  </style>
  <defs>
    <marker id="arrM" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#8e8e93"/>
    </marker>
  </defs>

  <rect x="0" y="-40" width="880" height="292" rx="14" fill="#fafbfc" stroke="#e2e4e9"/>

  <text x="16" y="-14" font-size="15" font-weight="700" fill="#273036">How to use <tspan class="mono">sb:map</tspan></text>

  <!-- left: what you have -->
  <text x="24" y="10" class="rail">WHAT YOU HAVE</text>
  <rect x="16" y="18" width="340" height="210" rx="10" fill="#ffffff" stroke="#c9ccd4" stroke-width="1.3"/>

  <rect x="40" y="53" width="140" height="86" rx="6" fill="#eceef2" stroke="#e2e4e9"/>
  <text x="48" y="66" class="sub mono" font-size="8.5">interview transcript</text>
  <rect x="58" y="71" width="140" height="86" rx="6" fill="#f4f5f7" stroke="#e2e4e9"/>
  <text x="66" y="84" class="sub mono" font-size="8.5">ops-runbook.xlsx</text>
  <rect x="76" y="89" width="140" height="86" rx="6" fill="#fafbfc" stroke="#d4d4da"/>
  <text x="84" y="102" class="sub mono" font-size="8.5" fill="#8a8f98">journey map (figjam)</text>
  <rect x="94" y="107" width="140" height="86" rx="6" fill="#ffffff" stroke="#c9ccd4" stroke-width="1.2"/>
  <text x="104" y="123" class="chip mono" font-size="9">research-notes.md</text>
  <line x1="104" y1="137" x2="216" y2="137" stroke="#eceef2" stroke-width="4"/>
  <line x1="104" y1="149" x2="196" y2="149" stroke="#eceef2" stroke-width="4"/>
  <line x1="104" y1="161" x2="208" y2="161" stroke="#eceef2" stroke-width="4"/>
  <line x1="104" y1="173" x2="180" y2="173" stroke="#eceef2" stroke-width="4"/>

  <!-- center: the skill -->
  <path class="flow" d="M356,123 L518,123"/>
  <rect x="365" y="96" width="150" height="54" rx="14" fill="#fdf1e3" stroke="#d4b483" stroke-width="1.4"/>
  <text x="440" y="118" class="title mono" text-anchor="middle">sb:map</text>
  <text x="440" y="134" class="sub" text-anchor="middle" fill="#6b7280">map your service</text>

  <!-- right: what you get -->
  <text x="532" y="10" class="rail">WHAT YOU GET</text>
  <rect x="524" y="18" width="340" height="210" rx="10" fill="#ffffff" stroke="#c9ccd4" stroke-width="1.3"/>

  <!-- one file, checked by the validator -->
  <g>
    <path d="M552,40 h44 l14,14 v40 a4,4 0 0 1 -4,4 h-54 a4,4 0 0 1 -4,-4 v-50 a4,4 0 0 1 4,-4 z" fill="#ffffff" stroke="#c9ccd4" stroke-width="1.2"/>
    <path d="M596,40 v14 h14" fill="none" stroke="#c9ccd4" stroke-width="1.2"/>
    <rect x="556" y="62" width="38" height="4" rx="2" fill="#eceef2"/>
    <rect x="556" y="70" width="46" height="4" rx="2" fill="#eceef2"/>
    <rect x="556" y="78" width="30" height="4" rx="2" fill="#eceef2"/>
    <circle cx="608" cy="92" r="9" fill="#e8f3ed" stroke="#9dbfa9"/>
    <path d="M604,92 L607,95 L613,88" fill="none" stroke="#4f5f52" stroke-width="1.6"/>
  </g>
  <text x="632" y="70" class="chip mono" font-size="9">blueprint.json</text>

  <!-- the same file, rendered -->
  <g>
    <rect x="552" y="122" width="288" height="86" rx="6" fill="#ffffff" stroke="#c9ccd4" stroke-width="1.2"/>
    <line x1="552" y1="136" x2="840" y2="136" stroke="#e2e4e9"/>
    <g opacity="0.9">
      <rect x="564" y="146" width="264" height="13" fill="#e8f3ed"/>
      <rect x="564" y="159" width="264" height="13" fill="#fdf1e3"/>
      <rect x="564" y="172" width="264" height="13" fill="#fbe9f0"/>
      <rect x="564" y="185" width="264" height="13" fill="#ecebf5"/>
      <rect x="564" y="146" width="264" height="52" fill="none" stroke="#d4d4da"/>
      <line x1="630" y1="146" x2="630" y2="198" stroke="#e2e4e9"/>
      <line x1="696" y1="146" x2="696" y2="198" stroke="#e2e4e9"/>
      <line x1="762" y1="146" x2="762" y2="198" stroke="#e2e4e9"/>
      <g fill="#ffffff" stroke="#d4d4da">
        <rect x="570" y="149" width="52" height="8" rx="2"/><rect x="702" y="149" width="52" height="8" rx="2"/>
        <rect x="636" y="162" width="52" height="8" rx="2"/><rect x="768" y="162" width="52" height="8" rx="2"/>
        <rect x="570" y="175" width="52" height="8" rx="2"/><rect x="702" y="175" width="52" height="8" rx="2"/>
        <rect x="636" y="188" width="52" height="8" rx="2"/>
      </g>
    </g>
  </g>
  <path d="M596,110 L596,118" stroke="#b6bac2" stroke-width="1" fill="none" marker-end="url(#arrM)"/>
</svg>
