<svg viewBox="0 -40 880 292" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <style>
    .title { font-size: 11px; font-weight: 700; fill: #273036; }
    .chip { font-size: 10px; font-weight: 600; fill: #273036; }
    .sub { font-size: 9.5px; fill: #9ca3af; }
    .rail { font-size: 9.5px; font-weight: 700; letter-spacing: .07em; fill: #8a8f98; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .flow { stroke: #8e8e93; stroke-width: 1.8; fill: none; marker-end: url(#arrS); }
    .thread { stroke: #b6bac2; stroke-width: 1; fill: none; stroke-dasharray: 4 3; }
  </style>
  <defs>
    <marker id="arrS" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#8e8e93"/>
    </marker>
  </defs>

  <rect x="0" y="-40" width="880" height="292" rx="14" fill="#fafbfc" stroke="#e2e4e9"/>

  <text x="16" y="-14" font-size="15" font-weight="700" fill="#273036">How to use <tspan class="mono">sb:slice</tspan></text>

  <!-- left: the whole blueprint -->
  <text x="24" y="10" class="rail">THE WHOLE BLUEPRINT</text>
  <rect x="16" y="18" width="340" height="210" rx="10" fill="#ffffff" stroke="#c9ccd4" stroke-width="1.3"/>
  <g opacity="0.65">
    <rect x="44" y="42" width="284" height="32" fill="#e8f3ed"/>
    <rect x="44" y="74" width="284" height="32" fill="#fdf1e3"/>
    <rect x="44" y="106" width="284" height="32" fill="#fbe9f0"/>
    <rect x="44" y="138" width="284" height="32" fill="#fbe9f0"/>
    <rect x="44" y="170" width="284" height="32" fill="#ecebf5"/>
    <rect x="44" y="42" width="284" height="160" fill="none" stroke="#d4d4da"/>
    <line x1="91" y1="42" x2="91" y2="202" stroke="#e2e4e9"/>
    <line x1="138" y1="42" x2="138" y2="202" stroke="#e2e4e9"/>
    <line x1="185" y1="42" x2="185" y2="202" stroke="#e2e4e9"/>
    <line x1="232" y1="42" x2="232" y2="202" stroke="#e2e4e9"/>
    <line x1="279" y1="42" x2="279" y2="202" stroke="#e2e4e9"/>
    <g fill="#ffffff" stroke="#d4d4da">
      <rect x="49" y="50" width="37" height="16" rx="3"/><rect x="96" y="50" width="37" height="16" rx="3"/><rect x="190" y="50" width="37" height="16" rx="3"/><rect x="284" y="50" width="37" height="16" rx="3"/>
      <rect x="49" y="82" width="37" height="16" rx="3"/><rect x="143" y="82" width="37" height="16" rx="3"/><rect x="237" y="82" width="37" height="16" rx="3"/>
      <rect x="96" y="114" width="37" height="16" rx="3"/><rect x="190" y="114" width="37" height="16" rx="3"/><rect x="284" y="114" width="37" height="16" rx="3"/>
      <rect x="49" y="146" width="37" height="16" rx="3"/><rect x="143" y="146" width="37" height="16" rx="3"/><rect x="284" y="146" width="37" height="16" rx="3"/>
      <rect x="96" y="178" width="37" height="16" rx="3"/><rect x="237" y="178" width="37" height="16" rx="3"/>
    </g>
  </g>

  <!-- center -->
  <path class="flow" d="M356,123 L518,123"/>
  <rect x="365" y="96" width="150" height="54" rx="14" fill="#fdf1e3" stroke="#d4b483" stroke-width="1.4"/>
  <text x="440" y="118" class="title mono" text-anchor="middle">sb:slice</text>
  <text x="440" y="134" class="sub" text-anchor="middle" fill="#6b7280">take the view you need</text>

  <!-- right: one document per slice, each shaped like what it holds -->
  <text x="532" y="10" class="rail">ONE DOCUMENT PER SLICE</text>
  <rect x="524" y="18" width="340" height="210" rx="10" fill="#ffffff" stroke="#c9ccd4" stroke-width="1.3"/>

  <!-- journey: moments in order, left to right -->
  <rect x="546" y="32" width="88" height="30" rx="4" fill="#fafbfc" stroke="#c9ccd4"/>
  <g fill="#ffffff" stroke="#9aadbe">
    <rect x="552" y="42" width="14" height="10" rx="2"/><rect x="570" y="42" width="14" height="10" rx="2"/>
    <rect x="588" y="42" width="14" height="10" rx="2"/><rect x="606" y="42" width="14" height="10" rx="2"/>
  </g>
  <text x="648" y="51" class="chip mono">journey</text>

  <!-- step: one moment, every lane -->
  <rect x="546" y="70" width="88" height="30" rx="4" fill="#fafbfc" stroke="#c9ccd4"/>
  <g fill="#ffffff" stroke="#9aadbe">
    <rect x="582" y="74" width="16" height="5" rx="1.5"/><rect x="582" y="81" width="16" height="5" rx="1.5"/>
    <rect x="582" y="88" width="16" height="5" rx="1.5"/><rect x="582" y="95" width="16" height="1"/>
  </g>
  <text x="648" y="89" class="chip mono">step</text>

  <!-- lane: one lane, the whole way across -->
  <rect x="546" y="108" width="88" height="30" rx="4" fill="#fafbfc" stroke="#c9ccd4"/>
  <rect x="552" y="119" width="76" height="9" rx="2" fill="#ffffff" stroke="#9aadbe"/>
  <text x="648" y="127" class="chip mono">lane</text>

  <!-- cell: one cell, specified -->
  <rect x="546" y="146" width="88" height="30" rx="4" fill="#fafbfc" stroke="#c9ccd4"/>
  <rect x="552" y="152" width="24" height="18" rx="3" fill="#ffffff" stroke="#9aadbe"/>
  <rect x="582" y="154" width="46" height="4" rx="2" fill="#eceef2"/>
  <rect x="582" y="162" width="38" height="4" rx="2" fill="#eceef2"/>
  <text x="648" y="165" class="chip mono">cell</text>

  <!-- custom: whatever the question needs -->
  <rect x="546" y="184" width="88" height="30" rx="4" fill="#fafbfc" stroke="#c9ccd4"/>
  <path d="M554,196 L572,190 L590,199 L606,192 L624,197" fill="none" stroke="#9aadbe" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="648" y="203" class="chip mono">custom</text>

  <!-- the documents keep pointing back at the cells they quote -->
  <path class="thread" d="M546,44 C440,26 300,32 227,58"/>
  <path class="thread" d="M546,150 C470,196 300,194 182,158"/>
</svg>
